<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playlist Transcript Summarizer</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="shell">
    <div class="header-row">
      <img src="images/logo.jpg" alt="Logo" class="logo" />
      <h1>Playlist Transcript Summarizer</h1>
    </div>
    <p>Paste up to 25 YouTube video IDs from your playlist. Choose a summary length, then generate summaries in the browser.</p>

    <div class="settings">
      <label class="checkbox-label">
        <input type="checkbox" id="useGemini" />
        Use Google Gemini for higher-quality summaries
      </label>
      <div id="geminiKeyRow" class="gemini-key-row" style="display:none;">
        <label for="geminiApiKey">Gemini API Key</label>
        <input type="password" id="geminiApiKey" placeholder="Paste your Gemini API key" autocomplete="off" />
        <p class="hint">Stored only in your browser (never uploaded to the repo). Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>.</p>
      </div>
    </div>

    <label for="videoIds">Video IDs</label>
    <textarea id="videoIds" placeholder="dQw4w9WgXcQ
L_X3vY7fiwQ
..."></textarea>

    <label for="summaryLength">Summary Length</label>
    <select id="summaryLength">
      <option value="short">Short</option>
      <option value="standard" selected>Standard</option>
      <option value="long">Long</option>
    </select>

    <button id="summarizeBtn" type="button">Summarize Videos</button>
    <button id="clearBtn" type="button">Clear</button>

    <div id="status" class="status" style="display:none;"></div>
    <div id="results" class="results"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
