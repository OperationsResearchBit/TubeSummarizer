<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playlist Transcript Summarizer</title>
  <style>
    :root {
      --bg: #f4f4f9;
      --card: #fff;
      --primary: #2563eb;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --radius: 12px;
    }
    body {
      font-family: system-ui, Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .shell {
      background: var(--card);
      padding: 28px;
      border-radius: var(--radius);
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { color: var(--muted); margin: 0 0 18px; line-height: 1.5; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: .5px;
    }
    textarea, select {
      width: 100%;
      box-sizing: border-box;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      font-size: 14px;
      margin-bottom: 14px;
      font-family: inherit;
      background: #fff;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
      font-family: monospace;
    }
    textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 14px 18px;
      font-weight: 700;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 14px;
    }
    button:hover { background: #1d4ed8; }
    .status {
      margin: 10px 0 18px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 10px;
      color: var(--muted);
      font-size: 14px;
      white-space: pre-wrap;
    }
    .error { color: #b91c1c; }
    .results { display: grid; gap: 14px; }
    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      background: #fff;
    }
    .card h3 { margin: 0 0 8px; font-size: 16px; }
    .meta { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .summary {
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .summary p {
      color: var(--text);
      margin: 0 0 12px;
    }
    .key-points {
      margin: 0;
      padding-left: 20px;
    }
    .key-points-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      margin: 0 0 6px;
    }
    .key-points li {
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <h1>Playlist Transcript Summarizer</h1>
    <p>Paste up to 25 YouTube video IDs from your playlist. Choose a summary length, then generate summaries in the browser.</p>

    <label for="videoIds">Video IDs</label>
    <textarea id="videoIds" placeholder="dQw4w9WgXcQ
L_X3vY7fiwQ
..."></textarea>

    <label for="summaryLength">Summary Length</label>
    <select id="summaryLength">
      <option value="short">Short</option>
      <option value="standard" selected>Standard</option>
      <option value="long">Long</option>
    </select>

    <button id="summarizeBtn" type="button">Summarize Videos</button>
    <button id="clearBtn" onclick="APP.clearAll()">Clear</button>

    <div id="status" class="status" style="display:none;"></div>
    <div id="results" class="results"></div>
  </div>

<script>
  // ============================================================
  // CONFIG
  // All tunable numbers/strings live here. Change pool sizes, the
  // transcript API endpoint, or bullet count limits without
  // touching any logic below.
  // ============================================================
  const CONFIG = {
    maxVideos: 25,
    transcriptBase: "https://youtube-transcript.ai/transcript/",
    transcriptCharLimit: 15000,
    pool: {
      short:    { keywords: 20, bigrams: 5 },
      standard: { keywords: 20, bigrams: 5 },
      long:     { keywords: 32, bigrams: 10 }
    },
    bullets: { min: 3, max: 6 }
  };

  // ============================================================
  // STOPWORDS
  // Pure data. Add/remove a word and nothing else needs to change.
  // Three buckets kept separate so it's obvious what each is for:
  //   common      -> ordinary English function words
  //   boilerplate -> website/player chrome that leaks into transcripts
  //   filler      -> high-frequency but low-information content words
  // ============================================================
  const STOPWORDS = {
    common: new Set([
      "a","about","above","after","again","all","also","am","an","and","any","are","as","at",
      "be","because","been","before","being","between","both","but","by","can","did","do",
      "does","doing","during","each","for","from","further","get","got","had","has","have",
      "having","he","her","here","him","his","how","i","if","in","into","is","it","its",
      "just","know","let","like","me","more","most","my","no","not","now","of","off","on",
      "once","only","or","other","our","out","over","own","re","said","same","she","should",
      "so","some","such","than","that","the","their","them","then","there","these","they",
      "this","those","through","to","too","under","until","up","very","was","we","were",
      "what","when","where","which","while","who","will","with","would","you","your",
      "uh","um","yeah","okay","ok","gonna","gotta","wanna","kinda","sorta","actually",
      "basically","literally","really","right","mean","think","going","want","need"
    ]),
    boilerplate: new Set([
      "https","http","www","youtube","youtu","com","org","net","transcript","transcripts",
      "caption","captions","subtitle","subtitles","video","videos","watch","watching","watched",
      "channel","subscribe","subscribed","subscribing","click","link","links","description",
      "below","above","comment","comments","notification","notifications","bell","icon"
    ]),
    filler: new Set([
      "make","made","making","makes","sure","still","seen","see","saw","look","looking",
      "looked","looks","example","examples","exactly","probably","maybe","kind","kinds",
      "sort","sorts","thing","things","stuff","lot","lots","way","ways","place","places",
      "taking","take","taken","takes","took","back","come","comes","coming","came","put",
      "puts","putting","else","everything","something","anything","nothing","someone",
      "anyone","everyone","nobody","quite","pretty","little","big","small","good","great",
      "well","better","best","worse","worst","thank","thanks","please","welcome","hello",
      "hey","guys","folks","everybody","truly","impressive","incredible","amazing","awesome",
      "fantastic","wonderful","terrible","horrible","huge","massive","tiny","definitely",
      "certainly","absolutely","totally","completely","obviously","clearly","honestly",
      "essentially","ultimately","first","second","third","next","last","one","two","three",
      "four","five","six","seven","eight","nine","ten"
    ]),
    // 10-12 char ID-like tokens (e.g. "Lz9lh3qypo8") that leak in via embedded links.
    idLike: /^[a-z0-9_-]{10,12}$/
  };

  // ============================================================
  // NLP
  // Tokenizing and keyword/bigram extraction. Pure functions —
  // no knowledge of summary structure, DOM, or app state.
  // ============================================================
  const NLP = {
    tokenize(text) {
      return text
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .split(/\s+/)
        .filter(w =>
          w.length > 3 &&
          !STOPWORDS.common.has(w) &&
          !STOPWORDS.boilerplate.has(w) &&
          !STOPWORDS.filler.has(w) &&
          !/\d/.test(w) &&              // drop tokens with digits (IDs, timestamps)
          !STOPWORDS.idLike.test(w)
        );
    },

    topKeywords(text, n) {
      const freq = {};
      for (const w of this.tokenize(text)) freq[w] = (freq[w] || 0) + 1;
      return Object.entries(freq)
        .sort((a, b) => b[1] - a[1])
        .slice(0, n)
        .map(([w]) => w);
    },

    bigrams(text, maxCount) {
      const words = this.tokenize(text);
      const freq = {};
      for (let i = 0; i < words.length - 1; i++) {
        const bg = words[i] + " " + words[i + 1];
        freq[bg] = (freq[bg] || 0) + 1;
      }
      return Object.entries(freq)
        .filter(([, c]) => c > 1)
        .sort((a, b) => b[1] - a[1])
        .slice(0, maxCount)
        .map(([p]) => p);
    },

    titleCase(str) {
      return str.replace(/\b\w/g, c => c.toUpperCase());
    },

    joinList(items) {
      if (items.length === 0) return "";
      if (items.length === 1) return items[0];
      if (items.length === 2) return items[0] + " and " + items[1];
      return items.slice(0, -1).join(", ") + ", and " + items[items.length - 1];
    }
  };

  // ============================================================
  // SUMMARIZER
  // Turns raw transcript text into { paragraph, bullets }.
  // Depends only on NLP + CONFIG — no DOM, no network.
  // ============================================================
  const SUMMARIZER = {
    templates: [
      t => `Highlights ${t} as a recurring theme throughout the video.`,
      t => `Explains how ${t} connects to the broader topic being discussed.`,
      t => `Offers practical takeaways related to ${t}.`,
      t => `Breaks down why ${t} matters in this context.`,
      t => `Draws a connection between ${t} and real-world application.`,
      t => `Provides additional perspective on ${t}.`
    ],

    clean(text) {
      return text
        .replace(/\[\d{1,2}:\d{2}(?::\d{2})?\]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, CONFIG.transcriptCharLimit);
    },

    // Splits ranked keywords into three non-overlapping tiers so the
    // paragraph doesn't repeat itself sentence to sentence.
    pickTiers(keywords, bigrams) {
      const primaryTopics = (bigrams.length > 0 ? bigrams.slice(0, 3) : keywords.slice(0, 3))
        .map(NLP.titleCase);
      const usedInPrimary = new Set(bigrams.slice(0, 3).flatMap(b => b.split(" ")).concat(keywords.slice(0, 3)));

      const secondaryRaw = keywords.filter(k => !usedInPrimary.has(k)).slice(0, 5);
      const secondaryKeywords = secondaryRaw.map(NLP.titleCase);
      const usedAfterSecondary = new Set([...usedInPrimary, ...secondaryRaw]);

      const thirdRaw = keywords.filter(k => !usedAfterSecondary.has(k)).slice(0, 4);
      const thirdSet = thirdRaw.map(NLP.titleCase);
      const usedAfterThird = new Set([...usedAfterSecondary, ...thirdRaw]);

      return { primaryTopics, secondaryKeywords, thirdSet, usedAfterThird };
    },

    buildParagraph({ primaryTopics, secondaryKeywords, thirdSet }, mode) {
      let summary = "In this video, the presenter explores " + NLP.joinList(primaryTopics);
      if (secondaryKeywords.length > 0) {
        summary += ", alongside key concepts such as " + NLP.joinList(secondaryKeywords);
      }
      summary += ".";

      if (mode === "short") return summary;

      summary += thirdSet.length > 0
        ? " The discussion also touches on " + NLP.joinList(thirdSet) + ", giving viewers a broader understanding of the subject matter."
        : " The content gives viewers a clear look at these topics and their practical significance.";

      if (mode === "standard") return summary;

      // long
      summary += " Overall, the video stays focused on the main ideas and connects them to useful context for the viewer.";
      return summary;
    },

    buildBullets({ primaryTopics, secondaryKeywords, usedAfterThird }, keywords, bigrams) {
      const leftoverBigrams = bigrams
        .filter(b => !b.split(" ").every(w => usedAfterThird.has(w)))
        .slice(3);
      const leftoverKeywords = keywords.filter(k => !usedAfterThird.has(k));

      const bulletTopics = [...leftoverBigrams, ...leftoverKeywords]
        .map(NLP.titleCase)
        .filter((v, i, arr) => arr.indexOf(v) === i)
        .slice(0, CONFIG.bullets.max);

      let bullets = bulletTopics.map((topic, i) => this.templates[i % this.templates.length](topic));

      if (bullets.length < CONFIG.bullets.min) {
        const fallbackTopics = [...primaryTopics, ...secondaryKeywords]
          .filter((v, i, arr) => arr.indexOf(v) === i)
          .slice(0, CONFIG.bullets.min - bullets.length);
        fallbackTopics.forEach((topic, i) => {
          bullets.push(this.templates[(bullets.length + i) % this.templates.length](topic));
        });
      }

      return bullets.slice(0, CONFIG.bullets.max);
    },

    // Public entry point. Returns { paragraph: string, bullets: string[] }.
    // bullets is always [] for "short" and "standard".
    summarize(text, mode) {
      const cleaned = this.clean(text);
      const { keywords: kN, bigrams: bN } = CONFIG.pool[mode] || CONFIG.pool.standard;
      const keywords = NLP.topKeywords(cleaned, kN);
      const bigramList = NLP.bigrams(cleaned, bN);

      if (keywords.length === 0) {
        return {
          paragraph: "This video presents a discussion of the main ideas covered throughout the transcript.",
          bullets: []
        };
      }

      const tiers = this.pickTiers(keywords, bigramList);
      const paragraph = this.buildParagraph(tiers, mode);
      const bullets = mode === "long" ? this.buildBullets(tiers, keywords, bigramList) : [];

      return { paragraph, bullets };
    }
  };

  // ============================================================
  // TRANSCRIPT
  // The only module that talks to the network or parses raw
  // user input into video IDs.
  // ============================================================
  const TRANSCRIPT = {
    parseIds(text) {
      return [...new Set(
        text.split(/[\s,]+/g)
          .map(s => s.trim())
          .filter(Boolean)
          .filter(s => /^[a-zA-Z0-9_-]{11}$/.test(s))
      )].slice(0, CONFIG.maxVideos);
    },

    async fetch(videoId) {
      const url = `${CONFIG.transcriptBase}${encodeURIComponent(videoId)}.txt`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("Transcript unavailable");
      return await res.text();
    }
  };

  // ============================================================
  // UI
  // DOM rendering and escaping only. No business logic here.
  // ============================================================
  const UI = {
    els: {
      videoIds: () => document.getElementById("videoIds"),
      summaryLength: () => document.getElementById("summaryLength"),
      status: () => document.getElementById("status"),
      results: () => document.getElementById("results")
    },

    escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    },

    setStatus(text) {
      const status = this.els.status();
      status.style.display = "block";
      status.textContent = text;
    },

    hideStatus() {
      const status = this.els.status();
      status.style.display = "none";
      status.textContent = "";
    },

    clearResults() {
      this.els.results().innerHTML = "";
    },

    addLoadingCard(index) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<h3>Video ${index + 1}</h3><div class="summary">Loading...</div>`;
      this.els.results().appendChild(card);
      return card;
    },

    renderSummary(card, result) {
      const paragraphHtml = `<p>${this.escapeHtml(result.paragraph)}</p>`;
      let bulletsHtml = "";
      if (result.bullets && result.bullets.length > 0) {
        bulletsHtml = `
          <div class="key-points-label">Key Points</div>
          <ul class="key-points">
            ${result.bullets.map(b => `<li>${this.escapeHtml(b)}</li>`).join("")}
          </ul>
        `;
      }
      card.querySelector(".summary").innerHTML = paragraphHtml + bulletsHtml;
    },

    clearInputs() {
      this.els.videoIds().value = "";
    }
  };

  // ============================================================
  // APP
  // Thin controller: wires TRANSCRIPT + SUMMARIZER + UI together.
  // Should stay free of extraction/rendering logic — if you find
  // yourself adding real logic here, it probably belongs in one
  // of the modules above.
  // ============================================================
  const APP = {
    async run() {
      const input = UI.els.videoIds().value.trim();
      const mode = UI.els.summaryLength().value;

      UI.clearResults();
      UI.setStatus("Running...");

      const ids = TRANSCRIPT.parseIds(input);
      if (!ids.length) {
        UI.setStatus("Please paste at least one valid YouTube video ID.");
        return;
      }

      try {
        for (let i = 0; i < ids.length; i++) {
          const card = UI.addLoadingCard(i);
          const transcript = await TRANSCRIPT.fetch(ids[i]);
          const result = SUMMARIZER.summarize(transcript, mode);
          UI.renderSummary(card, result);
        }
        UI.setStatus(`Done. Processed ${ids.length} video(s).`);
      } catch (err) {
        UI.setStatus(`Error: ${err.message}`);
      }
    },

    clearAll() {
      UI.clearInputs();
      UI.clearResults();
      UI.hideStatus();
    },

    init() {
      document.getElementById("summarizeBtn").addEventListener("click", () => APP.run());
      document.getElementById("clearBtn")?.addEventListener("click", () => APP.clearAll());
    }
  };

  document.addEventListener("DOMContentLoaded", () => APP.init());
</script>
</body>
</html>
